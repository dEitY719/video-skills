<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=830" />
    <title>circle-pop</title>
    <script>
      // circle-pop CONFIG: every piece of on-screen text and every tunable.
      // The block between the markers is strict JSON (no comments) because the
      // hf-motion scaffold parses and rewrites it. After a hand edit, re-run
      // `scaffold.mjs circle-pop <dir> --update` so the static timing
      // attributes follow; the timeline refuses to build if they disagree.
      const CONFIG = /* CONFIG:BEGIN */{
        "from": "아이디어",
        "to": "완성된 영상",
        "duration": 6,
        "switchAt": 3,
        "paper": "#f2eee6",
        "charcoal": "#1e1e1e",
        "red": "#e5322d"
      }/* CONFIG:END */;
    </script>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "PopSans";
        src: url("assets/fonts/NanumSquare_acEB.ttf") format("truetype");
        font-weight: 800;
        font-style: normal;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 830px; overflow: hidden; background: var(--charcoal); }
      #stage {
        position: relative; width: 1080px; height: 830px; overflow: hidden;
        background: var(--charcoal); font-family: "PopSans", sans-serif; font-weight: 800;
      }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .content {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 36px; text-align: center;
      }
      .word { font-size: 170px; line-height: 1.1; white-space: nowrap; }
      .bar { width: 260px; height: 18px; background: var(--red); }
      #s1 { background: var(--paper); color: var(--charcoal); }
      /* the popping dot: 120 px, grows x12 (1440 px) to cover the 1080x830 frame */
      #s1-dot {
        position: absolute; left: 50%; top: 50%; width: 120px; height: 120px;
        margin: -60px 0 0 -60px; border-radius: 50%; background: var(--red); z-index: 5;
      }
      #s2 { background: var(--red); }
      /* the revealed scene, clipped to a growing circle */
      #s2-disc { position: absolute; inset: 0; background: var(--charcoal); color: var(--paper); }
    </style>
  </head>
  <body>
    <!-- Timing attributes below are written by the scaffold from CONFIG
         (root data-duration is read statically by the engine, before any
         script runs). Do not hand-edit them. -->
    <div id="stage" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="830">
      <section id="s1" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div class="content">
          <div id="s1-word" class="word"></div>
          <div id="s1-bar" class="bar"></div>
        </div>
        <div id="s1-dot" data-layout-allow-overflow="true"></div>
      </section>
      <section id="s2" class="clip" data-start="3" data-duration="3" data-track-index="0">
        <div id="s2-disc">
          <div class="content">
            <div id="s2-word" class="word"></div>
            <div id="s2-bar" class="bar"></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const C = CONFIG;
      const $ = (id) => document.getElementById(id);
      const win = (id) => {
        const el = $(id);
        return { start: +el.dataset.start, end: +el.dataset.start + +el.dataset.duration, dur: +el.dataset.duration };
      };

      // ---- palette: exactly three colours
      const root = document.documentElement.style;
      root.setProperty("--paper", C.paper);
      root.setProperty("--charcoal", C.charcoal);
      root.setProperty("--red", C.red);

      // ---- guard: the static timing attributes must match CONFIG
      const want = { s1: C.switchAt, s2: C.duration - C.switchAt };
      for (const [id, d] of Object.entries(want)) {
        if (Math.abs(win(id).dur - d) > 1e-3) {
          throw new Error(`circle-pop: #${id} lasts ${win(id).dur}s but CONFIG implies ${d}s; re-run scaffold --update`);
        }
      }

      // ponytail: per-glyph width estimate (same as intro-kinetic), shrinks only
      const fit = (text, px, maxW = 920) => {
        let em = 0;
        for (const ch of text) {
          if (/[ㄱ-힣一-鿿]/.test(ch)) em += 0.95;
          else if (/[\s,.]/.test(ch)) em += 0.3;
          else if (/[A-Z]/.test(ch)) em += 0.7;
          else em += 0.6;
        }
        return Math.min(px, Math.floor(maxW / Math.max(em, 0.01)));
      };
      for (const [id, text] of [["s1-word", C.from], ["s2-word", C.to]]) {
        $(id).textContent = text;
        $(id).style.fontSize = fit(text, 170) + "px";
      }

      // ---- timeline: positions = scene window (from the DOM) + fixed offsets
      const tl = gsap.timeline({ paused: true });
      const w1 = win("s1"), w2 = win("s2");

      // Scene 1: word pops in, red bar draws
      tl.fromTo("#s1-word", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(2)" }, w1.start);
      tl.fromTo("#s1-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, w1.start + 0.3);

      // Circle pop: the dot pops (back ease), then grows to cover the frame exactly on the cut
      tl.fromTo("#s1-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, w1.end - 0.55);
      tl.to("#s1-dot", { scale: 12, duration: 0.25, ease: "power3.in" }, w1.end - 0.25);

      // Scene 2: a charcoal circle pops open on the red, revealing the next word inside it
      tl.fromTo("#s2-disc", { clipPath: "circle(0px at 50% 50%)" }, { clipPath: "circle(720px at 50% 50%)", duration: 0.6, ease: "back.out(1.6)" }, w2.start);
      tl.fromTo("#s2-word", { scale: 0.5 }, { scale: 1, duration: 0.6, ease: "back.out(2.2)" }, w2.start);
      tl.fromTo("#s2-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, w2.start + 0.35);
      tl.set({}, {}, w2.end);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
